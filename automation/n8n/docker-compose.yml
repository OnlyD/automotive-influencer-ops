services:
  operations:
    build:
      context: ../..
      dockerfile: automation/n8n/Dockerfile.operations
      args:
        SOURCE_COMMIT: ${OPS_SOURCE_COMMIT:?Set OPS_SOURCE_COMMIT to the exact reviewed Git commit}
    environment:
      OPS_STORAGE: /data/operations
      OPS_CONTAINER_MODE: local-compose
      OPS_PORT: 4318
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ../../.local:/data
    networks: [operations]
    restart: "no"
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.code"]'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_PRUNE: "true"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/approved-workflows:ro
    networks: [operations]
    depends_on: [operations]
    restart: "no"
networks:
  operations:
    internal: true
volumes:
  n8n_data:
